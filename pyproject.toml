[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basilic"
version = "0.2.0"
description = "Lightweight asynchronous web framework based on japronto, styled like Flask"
readme = "README.md"
requires-python = ">=3.5"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "brosskev", email = "jecob.akhmedov@gmail.com" }]
keywords = ["web", "framework", "python", "flask", "asynchronous", "basilic", "fast", "japronto"]
dependencies = [
    "japronto",
    "jinja2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]

[project.urls]
Homepage = "https://github.com/Jacobamv/Basilic"
Repository = "https://github.com/Jacobamv/Basilic"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["basilic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
